name: Publish to Comfy Registry

# Publishes the version in pyproject.toml whenever a release tag is pushed
# (the same tags release.yml turns into GitHub releases), or on demand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish custom node
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'KaletoAI' }}
    steps:
      - name: Publish to the Comfy Registry
        # Pinned to the main commit: tag 1.0.1 still calls `comfy --yes`, which
        # current comfy-cli rejects.
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
